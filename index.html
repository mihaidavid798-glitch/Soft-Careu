<style>
:root{
  --page:#EEF1F4;--surface:#FFFFFF;--surface-2:#F3F5F8;--ink:#121A24;--ink-2:#475262;--muted:#76828F;
  --line:#DDE3E9;--draw:#C2CAD3;--s1:#2A78D6;--v:#0F7A2E;--e:#687384;--i:#C0352E;--live:#C8302A;--star:#D99A00;--focus:#2A78D6;
  --fa:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fc:"Sofia Sans Extra Condensed","Sofia Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --page:#0B111A;--surface:#141C27;--surface-2:#1C2633;--ink:#E9EEF4;--ink-2:#B3BDCA;--muted:#8592A1;
  --line:#243041;--draw:#4A576B;--s1:#3987E5;--v:#13803A;--e:#5F6B7C;--i:#C23A33;--live:#FF6A5E;--star:#F2B630;--focus:#6AA6F0;color-scheme:dark}}
:root[data-theme=dark]{
  --page:#0B111A;--surface:#141C27;--surface-2:#1C2633;--ink:#E9EEF4;--ink-2:#B3BDCA;--muted:#8592A1;
  --line:#243041;--draw:#4A576B;--s1:#3987E5;--v:#13803A;--e:#5F6B7C;--i:#C23A33;--live:#FF6A5E;--star:#F2B630;--focus:#6AA6F0;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.42 var(--fa);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
h1,h2,h3{font-weight:700}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* headers */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 20px) 12px 12px 16px}
.hero h1{margin:0;font:800 42px/.9 var(--fc);letter-spacing:-.3px}
.ico{display:inline-grid;place-items:center;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);padding:0}
.ico svg{width:24px;height:24px}
.ico[aria-pressed=true]{color:var(--star)}
.bar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 4px) 6px 4px;background:var(--page);background:color-mix(in srgb,var(--page) 84%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px)}
.back{display:inline-flex;align-items:center;border:0;background:none;padding:9px 10px 9px 2px;font-weight:600;font-size:16px;color:var(--ink)}
.back svg{width:22px;height:22px}
.bar .ttl{text-align:center;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .rt{min-width:44px;display:flex;justify-content:flex-end}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 16px 10px}
.sec h2{margin:0;font:700 26px/1 var(--fc);letter-spacing:-.1px}
.sec .aside{font-size:13px;color:var(--muted);text-align:right}

/* lists */
.grp,.panel{background:var(--surface);margin:0 12px;border-radius:16px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;text-decoration:none}
.row+.row::before,.mrow+.mrow::before,.lrow+.lrow::before,.frow+.frow::before,.tr+.tr::before,.hrow+.hrow::before{content:"";position:absolute;top:0;right:0;left:50px;border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{display:block;margin-top:1px;color:var(--muted);font-size:13.5px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.note{margin:10px 16px;color:var(--muted);font-size:13.5px}
.panel .note{margin:12px 16px}
.empty{margin:30px 20px;color:var(--ink-2);font-size:15px}
.cr{width:24px;height:24px;object-fit:contain;flex:none}
.cr.lg{width:40px;height:40px}
.cr.xl{width:64px;height:64px}
.mono{display:inline-grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font:800 9.5px/1 var(--fa)}
.cr.xl.mono{font-size:18px}.cr.lg.mono{font-size:13px}
.ci{width:20px;height:20px;object-fit:contain;flex:none}
.ci.f{display:inline-grid;place-items:center;font-size:16px;line-height:1}
.ci.lg{width:36px;height:36px;font-size:28px}
.ci.fl{display:block;width:auto;height:auto}.ci.fl svg{display:block;width:20px;height:14px;border-radius:3px;box-shadow:0 0 0 1px var(--line)}.ci.fl.lg svg{width:36px;height:24px;border-radius:4px}

/* day strip */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.days a{flex:none;padding:8px 13px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.days a[aria-current=true]{background:var(--ink);color:var(--surface)}
.ch{display:flex;align-items:center;gap:9px;padding:20px 16px 8px;font-weight:700;font-size:15px;text-decoration:none}

/* match rows */
.mrow{position:relative;display:grid;grid-template-columns:54px 1fr auto;grid-template-rows:auto auto;align-items:center;column-gap:10px;row-gap:6px;padding:11px 14px 11px 6px;text-decoration:none}
.mrow+.mrow::before{left:60px}
.mrow .t{grid-row:1/3;text-align:center;font-weight:600;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.15}
.mrow .t.live{color:var(--live)}
.mrow .tm{display:flex;align-items:center;gap:9px;min-width:0;font-size:15.5px}
.mrow .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sc{font:700 19px/1 var(--fc);text-align:right;font-variant-numeric:tabular-nums;min-width:14px}
.mrow .cr{width:20px;height:20px}
.lo{color:var(--muted)}

/* match header */
.mh{position:relative;display:grid;grid-template-columns:1fr minmax(96px,auto) 1fr;gap:6px 8px;align-items:start;padding:20px 12px 16px;background:var(--surface);overflow:hidden}
.mh::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,color-mix(in srgb,var(--ca) 24%,transparent),transparent 42%,transparent 58%,color-mix(in srgb,var(--cb) 24%,transparent))}
.mh .side{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;text-decoration:none;min-width:0}
.mh .nm{font:700 21px/1.05 var(--fc);overflow-wrap:anywhere}
.mh .mid{position:relative;text-align:center;padding-top:8px}
.mh .big{font:800 48px/1 var(--fc);letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mh .big .dash{padding:0 5px;color:var(--muted)}
.mh .vs{font:800 34px/1 var(--fc);color:var(--muted);padding-top:8px}
.mh .st{margin-top:6px;font-size:13px;color:var(--ink-2)}
.mh .st.live{color:var(--live);font-weight:700}
.mh .pen{margin-top:4px;font-size:13px;color:var(--ink-2)}
.mh .meta{position:relative;grid-column:1/-1;margin:8px 0 0;text-align:center;font-size:13.5px;color:var(--ink-2)}

/* probability rows: the broadcast element */
.lg{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:14px 16px 2px;font-size:13px;font-weight:600;color:var(--ink-2)}
.lg span{display:flex;align-items:center;gap:6px;min-width:0}
.lg span b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg span:last-child{justify-content:flex-end}

.pitch .pf{inset:7px;border-radius:3px}
.pitch .pmid{left:7px;right:7px;top:50%;height:0;border-width:1.5px 0 0}
.pitch .pcc{left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%}
.pitch .pcs{left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border:0;border-radius:50%;background:rgba(255,255,255,.4)}
.pitch .pa{left:22%;right:22%;height:88px}.pitch .pa.t{top:7px;border-top:0}.pitch .pa.b{bottom:7px;border-bottom:0}
.pitch .ga{left:37%;right:37%;height:30px}.pitch .ga.t{top:7px;border-top:0}.pitch .ga.b{bottom:7px;border-bottom:0}
.pitch .parc{left:50%;width:70px;height:16px;margin-left:-35px}
.pitch .parc.t{top:95px;border-top:0;border-radius:0 0 35px 35px/0 0 16px 16px}
.pitch .parc.b{bottom:95px;border-bottom:0;border-radius:35px 35px 0 0/16px 16px 0 0}
.pt{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:96px;padding:0;border:0;background:none;color:#fff;font:inherit;transform:translateX(-50%);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt .ph{position:relative;width:44px;height:44px;border-radius:50%;background:#E3E8ED;box-shadow:0 0 0 2px var(--ring,#fff)}
.pt .ph img,.pt .ph .mono{display:grid;width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.pt .ph .mono{place-items:center;background:#E3E8ED;color:#3B4654;font:800 13px/1 var(--fa)}
.pt .bd{position:absolute;left:24px;bottom:-5px}
.pt .nm{max-width:100%;padding:1px 5px 2px;border-radius:6px;background:rgba(5,14,9,.62);font:600 12px/1.3 var(--fa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .nm i{margin-right:3px;font-style:normal;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.pt.on .ph{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--ring,#fff)}
.pt.on .nm{background:#fff;color:#0E1620}
.pt:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
.bd{display:inline-block;padding:1px 5px;border-radius:6px;background:rgba(5,14,9,.8);box-shadow:0 0 0 1px rgba(255,255,255,.28);color:#fff;font:700 11.5px/1.3 var(--fa);white-space:nowrap;font-variant-numeric:tabular-nums}
.bd.r1{background:#C8372D}.bd.r2{background:#EE8A19;color:#111}.bd.r3{background:#A9C23C;color:#111}.bd.r4{background:#15873E}.bd.r5{background:#1C6FD1}
.ptm{position:absolute;left:12px;z-index:1;display:flex;align-items:center;gap:7px;padding:4px 6px 4px 5px;border-radius:12px;background:rgba(5,14,9,.5);font:700 13px var(--fa)}
.ptm.t{top:12px}.ptm.b{bottom:12px}
.ptm .cr{width:20px;height:20px}
.ptf{position:absolute;right:14px;z-index:1;color:rgba(255,255,255,.9);font:700 17px/1 var(--fc);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.ptf.t{top:17px}.ptf.b{bottom:17px}
.ptm .bd{font-size:12.5px}
.pinfo{margin:10px 16px 12px;color:var(--ink-2);font-size:14px;line-height:1.45}
.pinfo b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pitch{background-color:#1B4A31}}
:root[data-theme=dark] .pitch{background-color:#1B4A31}
/* meciurile arbitrului din sezon */
.rml{padding:0 0 6px}
.rm{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:14px}
.rm+.rm{border-top:1px solid var(--line)}
.rm .d{flex:none;width:50px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rm .t{flex:1;min-width:0;line-height:1.25}
.rm .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .t small{display:block;margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .c{flex:none;display:flex;align-items:center;gap:4px;font:700 14px/1 var(--fc);font-variant-numeric:tabular-nums}
.rm .c i{display:inline-block;width:9px;height:12px;border-radius:2px;background:#E8B400}
.rm .c i.r{margin-left:5px;background:#D93A2F}
.rm .c.q{color:var(--muted);font-weight:500}
/* fila Clasament */
.tbs{margin:0 12px 10px}
.ctab{margin:0 12px;border-radius:16px;background:var(--surface);overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ctab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ctab+.gname,.ctab+.tbo{margin-top:18px}
.stt{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;font-variant-numeric:tabular-nums}
.stt th,.stt td{height:46px;padding:0 5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;font-weight:400}

.stt .c0{position:sticky;left:0;z-index:1;padding:0 8px 0 0;background:var(--surface);text-align:left;box-shadow:inset -1px 0 0 var(--line)}
.stt thead .c0{padding-left:10px}
.stt tbody .c0::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:4px;border-radius:0 3px 3px 0;background:var(--nc,transparent)}
.stt .c0 a{display:flex;align-items:center;gap:8px;height:46px;padding-left:9px;color:inherit;text-decoration:none}
.stt .ps{flex:none;display:inline-block;width:20px;margin-right:2px;text-align:right;color:var(--ink-2)}
.stt thead .ps{margin-right:10px}
.stt .cr{width:22px;height:22px}
.stt .tn{display:block;max-width:116px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.stt td{min-width:25px;color:var(--ink-2)}
.stt td.gg{min-width:42px}
.stt td.tpt b{color:var(--ink);font-weight:700}
.stt .fm{padding:0 12px 0 8px;text-align:left}
.stt thead .fm{text-align:left;padding-left:10px}
.stt tr.me>*{background:color-mix(in srgb,var(--mc) 13%,var(--surface))}
.stt tr.me .tn{font-weight:700}
@media (min-width:560px){.stt .tn{max-width:220px}}
.fis{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.fis.none{color:var(--muted)}
.fi{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;padding:0;border:0;border-radius:50%;color:#fff;cursor:pointer}
.fi svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fi.W{background:var(--v)}.fi.D{background:var(--e)}.fi.L{background:var(--i)}
.fi.last{margin-left:3px;outline:2px solid;outline-offset:2px}
.fi.W.last{outline-color:var(--v)}.fi.D.last{outline-color:var(--e)}.fi.L.last{outline-color:var(--i)}
.fi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details.tbo{margin:18px 0 0}
details.tbo>summary{margin:0 16px 4px;padding:8px 0;font-weight:600;color:var(--ink-2)}
#tb-fi:empty{display:none}
.tleg{margin:12px 12px 0;padding:6px 16px 10px;border-radius:16px;background:var(--surface)}
.tleg h3{margin:10px 0 6px;font-size:14.5px}
.tleg p{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px;color:var(--ink-2)}
.tleg p.sm{display:block;font-size:13px;color:var(--muted)}
.tleg .zq{width:12px;height:12px;border-radius:3px;flex:none}
.tleg .fi{cursor:default}
.sb .v small{display:block;margin-top:4px;font:500 11.5px/1 var(--fa);color:var(--muted)}
.lb .lbh{margin:0;padding:12px 16px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.lb .lr{display:grid;grid-template-columns:22px 24px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 16px;color:inherit;text-decoration:none}
.lb .lr+.lr,.lb .gap+.lr{border-top:1px solid var(--line)}
.lb .lr .k{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.lb .lr .cr{width:24px;height:24px}
.lb .lr .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lr .n small{display:block;margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .lr .v{font:700 19px/1 var(--fc);font-variant-numeric:tabular-nums}
.lb .lr.me{background:color-mix(in srgb,var(--mc) 13%,var(--surface))}
.lb .gap{margin:0;padding:0 16px 2px;border-top:1px solid var(--line);color:var(--muted);text-align:center;letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* fila Live */

.lvtile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lvbody{min-height:200px}
.lvpill{display:inline-block;padding:2px 7px;border:1px solid var(--model);border-radius:7px;color:var(--model);font:700 10.5px/1.2 var(--fa);letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;vertical-align:2px}
.lvpill.r{border-color:var(--ink-2);color:var(--ink-2)}
.lvm{color:var(--model)}
b.lvm,.lvpr b{font:800 30px/1 var(--fc)}
.sb.lvna .l small{font-style:italic}
.lvsrc{display:block;font-size:11px;color:var(--muted)}
.row.lvev{min-height:44px;gap:10px}

.lvei{flex:none;width:20px;text-align:center}
.lvcard{display:inline-block;width:10px;height:14px;border-radius:2px;background:var(--i);vertical-align:-2px}

.row .dot,.lvpr .dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:3px}
.lvpress{padding:14px 16px}

.lvsh{display:flex;justify-content:space-between;margin:4px 0 0;font:700 13px var(--fa);color:var(--ink-2)}

.row.lvrow.hd{min-height:34px;font-size:12.5px;font-weight:700;color:var(--muted)}
.lvv{text-align:right;font:700 16px var(--fc);font-variant-numeric:tabular-nums}
.row.lvrow.hd .lvv{font:700 12px var(--fa)}
.row.lvrow small.lvm{color:var(--model)}
.lvchart{padding-bottom:12px}
.lvchart .note{margin-left:16px;margin-right:16px}
.lvsvg{display:block;width:calc(100% - 16px);height:auto;margin:6px 8px 0;touch-action:pan-y;font-family:var(--fa)}

.pr.lvmodel .num{color:var(--model)}

.lvai{padding-bottom:14px}

.lvul{margin:6px 16px 0;padding-left:20px;font-size:14.5px;line-height:1.5}
.lvconf{display:flex;align-items:center;gap:10px;margin:8px 16px 0}
.lvmeter{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}

.odsrch{margin:0 12px 10px}

.odh b{font-weight:700;min-width:0}
.odh small{flex:none;font:600 12px var(--fa)}
.odh small.lvm{color:var(--model)}
.odr{display:grid;grid-template-columns:minmax(44px,max-content) 1fr;gap:8px;align-items:center}
.odr+.odr{margin-top:6px}
.odl{max-width:96px;font:600 13px/1.2 var(--fa);color:var(--ink-2);overflow-wrap:anywhere}
.odcs{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.odc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;min-height:60px;padding:7px 4px 6px;border:1.5px solid transparent;border-radius:11px;background:var(--surface-2);font:inherit;color:var(--ink);text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.odc .odo{max-width:100%;font:500 12.5px/1.25 var(--fa);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odc b{font:700 17px/1.2 var(--fc);font-variant-numeric:tabular-nums}
.odc small{font:600 11.5px/1.2 var(--fa);color:var(--muted)}
.odc small.lvm{color:var(--model)}
.odc .odv{font:700 11.5px var(--fa);font-style:normal;color:var(--v)}
.odc.val{border-color:color-mix(in srgb,var(--v) 50%,transparent)}
.odc.on{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 9%,var(--surface-2))}
.odc.na{cursor:default}
.odc.off{opacity:.5;cursor:default}
@media (hover:hover){button.odc:hover{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}}
button.odc:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.odmore{display:block;width:100%;margin-top:8px;padding:9px;border:0;border-radius:10px;background:var(--surface-2);font:600 14px var(--fa);color:var(--ink-2);cursor:pointer}
.odbar{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:6;display:flex;align-items:center;gap:10px;margin:14px 12px 0;padding:10px 10px 10px 14px;border-radius:14px;background:var(--ink);color:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.odbar[hidden]{display:none}
.odbt{flex:1;min-width:0;line-height:1.2}
.odbt b{display:block;font-size:15px}
.odbt small{display:block;margin-top:2px;font:600 13px var(--fa);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odbt small .lvm{color:inherit}
.odbar .btn{flex:none;margin:0;padding:8px 14px;background:var(--surface);color:var(--ink);text-decoration:none}
.odbar .ico{flex:none;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--surface) 16%,transparent);color:var(--surface);font:700 16px var(--fa)}
.odhint{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:30;max-width:600px;margin:0 auto;padding:11px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font:500 14px/1.35 var(--fa);box-shadow:0 6px 24px rgba(0,0,0,.2)}
.odhint[hidden]{display:none}
.odsrc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 12px 8px}
.odsrc button{border:1px solid var(--line);padding:6px 11px;border-radius:999px;background:var(--surface);font:600 13.5px var(--fa);color:var(--ink-2);cursor:pointer}
.odsrc button small{margin-left:6px;font:600 12px var(--fa);color:var(--muted)}
.odsrc button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.odsrc button[aria-pressed=true] small{color:inherit;opacity:.72}
.odwait{font:500 12.5px var(--fa);color:var(--muted)}
.odbad{margin-top:0}
.odsl0{margin-right:2px;font:600 13px var(--fa);color:var(--muted)}
.odchips.odsub{padding-top:2px}
.odchips.odsub button{padding:6px 11px;font-size:13.5px;background:var(--surface-2)}
.odchips.odsub button[aria-selected=true]{background:var(--ink-2);color:var(--surface)}
.odpr{display:grid;grid-template-columns:minmax(0,1fr) calc(var(--n,1) * 70px + (var(--n,1) - 1) * 6px);gap:8px;align-items:center}
.odpr+.odpr{margin-top:6px}
.odpl .odpr .odc{min-height:48px;padding:5px 3px}
.odpn{display:flex;align-items:center;gap:6px;min-width:0;font:600 14px/1.25 var(--fa);overflow-wrap:anywhere}
.oddot{flex:none;width:8px;height:8px;border-radius:50%}
.odph{margin-bottom:4px}
.odph .odcs span{font:600 12px var(--fa);color:var(--muted);text-align:center}
.odc.odnone{visibility:hidden}
.odpl.odst .odpr{grid-template-columns:1fr;gap:4px}
.odpl.odst .odph>span:first-child{display:none}
.odpl.odst .odpr+.odpr{margin-top:10px}
.odpl .odpr .odc{min-height:44px}

/* bet builder-ele casei: toate picioarele la vedere */
.odbb .odc .odo{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}
/* sub-filele în dale (Cote, Jucători, Clasament), ca în fila Live */
.lvtiles{scroll-margin-top:calc(env(safe-area-inset-top) + 106px)}
.lvtiles.subtiles{margin:0 12px 12px}
#odchips .lvtiles.subtiles{margin-top:2px}
.subtiles .lvtile{min-height:72px}
.subtiles .lvtile .lt{font-size:13px}
@media (min-width:640px){.lvtiles.subtiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}

/* ---------- instalarea ca aplicație ---------- */
.inst{display:flex;align-items:flex-start;gap:12px;margin:10px 12px 2px;padding:12px 4px 12px 12px;background:var(--surface);border-radius:16px}
.inst-i{flex:none;width:42px;height:42px;border-radius:11px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.inst-i svg{display:block;width:100%;height:100%}
.inst-t{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--ink-2)}

.inst-t span{display:block;margin:2px 0 10px}
.inst-t .btn{padding:8px 14px;font-size:14px}
.inst .ico{flex:none;margin-top:-4px}
.btn[hidden]{display:none}

/* ---------- fila Live din bara de jos ---------- */
.tabs a{position:relative}
.navdot{position:absolute;top:7px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px var(--surface)}
.navdot[hidden]{display:none}
.lvlhd{margin:2px 16px 0}
.lvlhd .lvst{font-size:15px}
.lvlhd .lvst .btn{margin-left:auto}
.lvsrc{margin:6px 0 0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.lvsrc b{color:var(--ink-2);font-weight:700}
.lvended{margin:22px 0 0}
.lvended>summary{margin:0 16px;padding:8px 0;font-weight:700;font-size:15px;color:var(--ink-2);cursor:pointer}
/* pagina meciului: legătura spre analiza live */
.lvgo{display:flex;align-items:center;gap:10px;margin:2px 12px 10px;padding:11px 14px;border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none}
.lvgt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lvgt b{font-size:15px;font-weight:700}
.lvgt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvgc{font-size:22px;line-height:1;color:var(--muted)}
/* pagina de analiză live: de unde vine */
.lvsolo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 16px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.lvsolo a{color:var(--s1);text-decoration:none;font-weight:700}

/* ---------- Pariuri → Value finder ---------- */
.vfhd{margin:0 12px 2px}
.vfprog{height:3px;margin-top:10px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.vfprog[hidden]{display:none}
.vfprog i{display:block;height:100%;width:0;background:var(--model);transition:width .3s}
.vfl{display:flex;flex-direction:column;gap:8px;margin:0 12px}
.vfp{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none}
.vft{display:flex;flex-direction:column;min-width:0;font:700 15px/1.1 var(--fa)}
.vft small{margin-top:3px;font:500 10.5px/1.2 var(--fa);color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vfm{display:flex;flex-direction:column;gap:2px;min-width:0}
.vfm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfm span{font-size:14px;font-weight:600;color:var(--ink-2)}
.vfo{display:flex;flex-direction:column;align-items:flex-end}
.vfo b{font:800 24px/1 var(--fc)}
.vfo small{margin-top:3px;max-width:96px;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfx{grid-column:2/4;font-size:12.5px;line-height:1.4;color:var(--muted)}
.vfx .lvm{font:700 12.5px/1 var(--fa)}
.vfx em{font-style:normal;font-weight:700;color:var(--ink-2)}
.vfx em.pos{color:var(--v)}
.vfmore{padding:10px 12px 0}
.vftag{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:6px;background:var(--surface-2);font:700 10.5px/1.5 var(--fa);font-style:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;vertical-align:1px}
.vfcats{display:flex;gap:6px;margin:0 0 10px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.vfcats::-webkit-scrollbar{display:none}
.vfcats .chip{flex:none;padding:8px 12px;font-size:13.5px}
.vfcats .chip[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.vfm b .oddot{display:inline-block;margin-right:6px;vertical-align:1px}

/* învățarea automată și valoarea pe toată oferta */
details.trd{margin-top:22px}
details.trd>summary{margin:0 16px;padding:8px 0;font-weight:700;font-size:15px;color:var(--ink-2);cursor:pointer}
#vblk .mrw.vb{grid-template-columns:1fr 52px 52px 60px;gap:3px 6px}
#vblk .mrw.vb>.lb{grid-column:1/-1}
#vblk .mrw.vb>small.bk{margin-top:0}
#vblk .mrw.vb>small.vbo{grid-column:1/-1;margin-top:1px}
#vblk .vbtyp{padding:4px 14px 2px;margin:0}
#vblk .vbtyp .chip small{margin-left:5px;font:700 11.5px/1 var(--fa);color:var(--muted)}
#vblk .vbtyp .chip[aria-pressed=true] small{color:inherit;opacity:.75}
/* Value finder: tipurile de pariu și istoricul */
.vftyp .chip small{margin-left:5px;font:700 11.5px/1 var(--fa);color:var(--muted)}
.vftyp .chip[aria-pressed=true] small{color:inherit;opacity:.75}
details.vfh{margin:22px 12px 0;border-top:0;background:var(--surface);border-radius:16px;overflow:hidden}
details.vfh>summary{font-weight:700;color:var(--ink)}
details.vfh>summary small{font-weight:500;font-size:13px;color:var(--muted)}
details.vfh .mrw b.pos,details.vfh .mrw b.neg{font-weight:800}
label.vfa{padding:14px 14px 4px}
details.vfh .mrw.vr{grid-template-columns:1fr 58px 58px;gap:3px 6px}
details.vfh .mrw.vr>.lb{grid-column:1/-1}
details.vfh .mrw.vr>small.bk{margin-top:0}
.vftyp{margin-top:4px}

.vfst{margin-bottom:4px}
.vfst .tile b small{display:block;margin-top:2px;font:500 12px/1.2 var(--fa);color:var(--muted)}
.vfst .tile b.pos{color:var(--v)}
.vfst .tile b.neg{color:var(--i)}
.vfr.won{box-shadow:inset 4px 0 0 var(--v)}
.vfr.lost{box-shadow:inset 4px 0 0 var(--i)}
.vfr.near{box-shadow:inset 4px 0 0 #D08A1A}
.vfr .vft{font-size:17px}
.vfmt{margin:0 12px;background:var(--surface);border-radius:16px;overflow:hidden}
.vfmt .grp{margin:0}
.vfmt .mrw.q{grid-template-columns:1fr 60px 58px 52px;gap:6px}
.vfverd{margin:10px 12px 0;padding:12px 14px;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;line-height:1.45;color:var(--ink-2)}
.vfverd.pos{color:var(--v)}
.vfverd.neg{color:var(--i)}
.vfrl{padding-top:18px}
.vfp.vfr{grid-template-columns:62px minmax(0,1fr) auto}
.vfr .vft small{white-space:nowrap;-webkit-line-clamp:1}
.vfor{display:block;margin-top:4px;font-size:11.5px;line-height:1.35;color:var(--muted)}
/* v17: cotele altor case, mișcarea cotei, echipele de start, cota de închidere, baza de date */
.vfalt{display:block;margin-top:4px;font-size:11.5px;line-height:1.35;color:var(--muted)}
.vfalt b.pos,.vbalt b.pos{color:var(--v);font-weight:800}
.vfmv{display:block;margin-top:3px;font:700 11px/1.2 var(--fa);white-space:nowrap}
.vfmv.dn{color:var(--v)}
.vfmv.up{color:var(--muted)}
i.vfmv{display:inline;margin:0 0 0 2px;font-style:normal}
.vflu{display:inline-block;align-self:flex-start;margin-top:4px;padding:1px 7px;border-radius:6px;background:var(--surface-2);font:700 10.5px/1.6 var(--fa);color:var(--muted)}
.vflu.new{background:color-mix(in srgb,var(--v) 15%,var(--surface));color:var(--v)}
.vfdrop{margin:14px 12px 0}
.vfr .vfx b.pos{color:var(--v)}
.vfr .vfx b.neg{color:var(--i)}

.dbp .acts{padding:0 16px 6px}
.dbp .note b{color:var(--ink-2)}

/* v18: „De ce?” și „+ Bilet” sub recomandări, Pinnacle, Value finder Live, Biletul meu, învățarea arbitrului */
.vfc{display:flex;flex-direction:column;border-radius:14px;background:var(--surface)}
.vfc>.vfp{background:transparent;padding-bottom:8px}
.vfbar{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px 76px}
.vfb{font:700 12px/1 var(--fa);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.vfb[aria-expanded="true"]{background:var(--surface-2);color:var(--ink)}
.vfwhyp{padding:0 14px 12px 76px;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.vfwhyp ul{margin:0;padding-left:16px}
.vfwhyp li+li{margin-top:3px}
.vfwhyp p{margin:0}
.vfpin b.pos{color:var(--v);font-weight:800}
.vftag.lv{background:color-mix(in srgb,var(--i) 14%,var(--surface));color:var(--i)}
.vflive .vft{font-variant-numeric:tabular-nums}
.tkl .tkm+.tkm{border-top:1px solid var(--line)}
.tkh{display:flex;flex-direction:column;gap:2px;padding:12px 16px 4px;color:var(--ink);text-decoration:none}
.tkh small{color:var(--muted);font-size:12px}
.tkr{padding-top:8px;padding-bottom:8px}
.tkr .grow small{display:block;margin-top:2px}
.tkr b.pos{color:var(--v)}.tkr b.neg{color:var(--i)}
.tkweak{margin:10px 0 0}
.tktoast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--page);font:600 13.5px/1.3 var(--fa);box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.tktoast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.tktoast a{color:inherit;font-weight:800;white-space:nowrap}
.fxp .note b{color:var(--ink-2)}
/* v19: filele de competiții din Value finder (numărul de meciuri sub nume) */
.vftiers button{padding:8px 4px}
.vftiers button small.cnt{margin-top:1px}
</style>

  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {

const s2l = c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
const rgbLin = h => [0, 2, 4].map(i => s2l(parseInt(h.slice(i, i + 2), 16) / 255));

  p: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
  d: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.011820, 0.042940, 0.968881]]
};
function oklab([r, g, b]) {
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);

}

function apart(h1, h2) {
  const a = rgbLin(h1), b = rgbLin(h2);
  if (dE(oklab(a), oklab(b)) < 15) return false;
  return Math.min(dE(oklab(simCVD(a, MACH.p)), oklab(simCVD(b, MACH.p))), dE(oklab(simCVD(a, MACH.d)), oklab(simCVD(b, MACH.d)))) >= 8;
}
const isDark = () => { const t = document.documentElement.dataset.theme; return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
function teamColors(A, B) {
  const dark = isDark();
  const surf = dark ? '141c27' : 'ffffff';
  const pal = dark ? ['3987e5', 'd95926'] : ['2a78d6', 'eb6834'];
  const usable = h => !!h && contrast(h, surf) >= 2;
  const chroma = h => { const [, a, b] = oklab(rgbLin(h)); return Math.hypot(a, b); };
  const order = t => { const c = [t?.color, t?.alt].filter(Boolean); if (c.length === 2 && chroma(c[0]) < 0.04 && chroma(c[1]) >= 0.06) c.reverse(); return c; };
  const ca = order(A).find(usable) || pal[0];
  const cb = order(B).find(h => usable(h) && apart(h, ca)) || [pal[1], pal[0]].find(h => apart(h, ca)) || pal[1];
  return ['#' + ca, '#' + cb];
}

/* ---------- fila Clasament: clasamentul competiției, acasă și în deplasare, forma și statistici pe echipe ---------- */

const TBL = store.get('lgc', {});

function tbFlush() {
  if (!tbDirty) return;

}

addEventListener('pagehide', tbFlush);
const tbErr = (where, e) => { LOG.unshift(`${new Date().toLocaleTimeString('ro-RO')}  fila Clasament, ${where}: ${e?.message || e}`); LOG.length = Math.min(LOG.length, 40); };

const TB_CAL = new Set(['usa.1', 'bra.1', 'arg.1', 'bra.2', 'arg.2', 'swe.1', 'nor.1', 'jpn.1', 'chn.1']);
function tbFrom(slug, now = new Date()) {
  if (NAT.has(slug)) return new Date(now.getTime() - 330 * 864e5);

}
// campionat (are clasament pe tot sezonul), nu cupă, supercupă, amical sau preliminarii
const tbIsLeague = s => !!s && !NAT.has(s) && !/cup|pokal|copa|coppa|coupe|taca|beker|\.fa$|super|charity|shield|friendly|qual/.test(s) && COMP[s]?.g !== 'eu';
const tbSt = o => (o && typeof o === 'object' ? [o.c, o.y, o.r, o.st, o.p, o.sh, o.f].map(v => (fin(v) ? v : null)) : null);
function tbRow(e) {

// meciurile terminate ale competiției, lună de lună (aceleași liste ca la arbitru)
async function tbSeason(slug, from, to, onProg) {
  const months = [];
  for (let a = new Date(from.getFullYear(), from.getMonth(), 1); a <= to; a = new Date(a.getFullYear(), a.getMonth() + 1, 1)) months.push(a);
  const got = new Map();
  let done = 0, bad = 0;
  await Promise.all(months.map(a => lim(async () => {
    const mk = `${a.getFullYear()}-${a.getMonth() + 1}`, end = new Date(a.getFullYear(), a.getMonth() + 1, 0, 23, 59, 59);
    const closed = end.getTime() < Date.now() - 3 * 864e5, hit = TBL[slug]?.[mk];
    try {
      let rows;
      if (closed && Array.isArray(hit?.[1])) rows = hit[1];
      else {
        const L = await once(`lg:${slug}:${mk}`, 20 * 60e3, () => monthGames(slug, a < from ? from : a, end < to ? end : to));
        rows = arr(L).map(g => g?.e).filter(e => e && e.done && e.home && e.away && fin(e.home.score) && fin(e.away.score)).map(tbRow);
        if (closed) { (TBL[slug] ||= {})[mk] = [Date.now(), rows]; tbDirty = true; }
      }
      for (const r of rows) if (Array.isArray(r) && r.length >= 6) got.set(r[0], r);
    } catch (e) { bad++; }
    onProg?.(++done, months.length);
  })));

}
// la competițiile 365Scores, statisticile se citesc meci cu meci (o singură dată: rămân în memoria aplicației)
async function tbStats365(rows, onProg) {
  const need = rows.filter(r => is365(r[0]) && (!r[6] || !r[7])).slice(-220);
  let done = 0;
  await Promise.all(need.map(r => lim365(async () => {

    } catch (e) {}

}

/* calculele: meciurile unei echipe, clasamentul unei grupe, statisticile pe echipe */
function tbGames(rows, id) {
  const G = [];
  for (const r of arr(rows)) {
    // un rând stricat (de exemplu din memoria telefonului) se sare
    if (!Array.isArray(r) || !fin(r[4]) || !fin(r[5])) continue;
    const h = r[2] === id, a = r[3] === id;
    if (!h && !a) continue;
    const gf = h ? r[4] : r[5], ga = h ? r[5] : r[4];
    G.push({ m: r[0], t: fin(r[1]) ? r[1] : 0, home: h, gf, ga, hs: r[4], as: r[5], opp: h ? r[3] : r[2], r: gf > ga ? 'W' : gf < ga ? 'L' : 'D', s: h ? r[6] : r[7], so: h ? r[7] : r[6] });
  }

}
function tbRec(G) {
  const o = { gp: G.length, w: 0, d: 0, l: 0, gf: 0, ga: 0 };
  for (const g of G) { o[g.r === 'W' ? 'w' : g.r === 'D' ? 'd' : 'l']++; o.gf += g.gf; o.ga += g.ga; }
  o.gd = o.gf - o.ga; o.pts = 3 * o.w + o.d; o.form = G.slice(-5);
  return o;
}
// side: all (clasamentul oficial, cu forma calculată), home sau away (calculate din meciuri)
function tbGroup(g, rows, side) {
  const per = g.rows.map(r => { const G = tbGames(rows, r.team.id); return { r, G, rec: tbRec(side === 'home' ? G.filter(x => x.home) : side === 'away' ? G.filter(x => !x.home) : G) }; });
  const v = (a, b) => (fin(a) ? a : b);
  if (side === 'all') return per.map(({ r, rec }) => ({ team: r.team, rank: r.rank, gp: v(r.gp, rec.gp), w: v(r.w, rec.w), d: v(r.d, rec.d), l: v(r.l, rec.l), gf: v(r.gf, rec.gf), ga: v(r.ga, rec.ga),
    gd: v(r.gd, fin(r.gf) && fin(r.ga) ? r.gf - r.ga : rec.gd), pts: v(r.pts, rec.pts), note: r.note, nc: r.nc, form: rec.gp ? rec.form : arr(r.rf) }));
  return per.map(({ r, rec }) => ({ team: r.team, gp: rec.gp, w: rec.w, d: rec.d, l: rec.l, gf: rec.gf, ga: rec.ga, gd: rec.gd, pts: rec.pts, form: rec.form }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || String(a.team.name).localeCompare(String(b.team.name), 'ro')).map((x, i) => ({ ...x, rank: i + 1 }));
}
// statisticile unei echipe în competiție
function tbTeamStats(rows, id) {
  const G = tbGames(rows, id), s = { gp: G.length, gf: 0, ga: 0, cs: 0, btts: 0, o25: 0, sum: Array(7).fill(0), n: Array(7).fill(0), sumO: Array(7).fill(0), nO: Array(7).fill(0) };
  for (const g of G) {
    s.gf += g.gf; s.ga += g.ga;
    if (!g.ga) s.cs++;
    if (g.gf && g.ga) s.btts++;
    if (g.gf + g.ga >= 3) s.o25++;

    if (Array.isArray(g.so)) g.so.forEach((x, i) => { if (fin(x)) { s.sumO[i] += x; s.nO[i]++; } });
  }

}
const tbAvg = (s, i) => (s.n[i] ? s.sum[i] / s.n[i] : null);

// toate grupele unei competiții: întâi cele cu echipele meciului, celelalte strânse

function tbLegendHTML(S) {

async function renderPicks(live) {
  const P = store.get('picks', {});
  const ids = Object.keys(P).sort((a, b) => new Date(P[b].date) - new Date(P[a].date));
  const box = $('#pk');
  if (!ids.length) { box.innerHTML = `<p class="empty">Când alegi un rezultat pe pagina unui meci viitor, apare aici și îl verific după fluier.</p>`; return; }
  const out = new Map();
  const draw = () => {
    if (!live()) return;
    let hit = 0, tot = 0, exact = 0;
    const rows = ids.map(id => {
      const p = P[id], r = out.get(id);
      let res = `<span class="res">${new Date(p.date) > Date.now() ? esc(whenShort(p.date)) : 'aștept rezultatul'}</span>`;
      if (r) {
        const o = r.h > r.a ? '1' : r.h < r.a ? '2' : 'X';
        const okP = p.pick ? p.pick === o : null, okS = p.score ? p.score === `${r.h}-${r.a}` : null;
        if (okP != null) { tot++; if (okP) hit++; }
        if (okS) exact++;
        const good = okP ?? okS;
        res = `<span class="res ${good ? 'ok' : 'no'}">${r.h}–${r.a}: ${okS ? 'scor exact' : good ? 'nimerit' : 'ratat'}</span>`;
      }
      return `<a class="row" href="#/m/${esc(p.slug || 'x')}/${esc(id)}"><span class="grow"><b>${esc(p.h)} – ${esc(p.a)}</b><small>Ai ales ${p.pick ? (p.pick === 'X' ? 'egal' : p.pick === '1' ? esc(p.h) : esc(p.a)) : 'doar scorul'}${p.score ? `, scor ${esc(p.score)}` : ''}</small></span>${res}</a>`;
    }).join('');
    box.innerHTML = `${tot ? `<p class="note">Ai nimerit ${hit} din ${tot} rezultate${exact ? `, plus ${exact} ${exact === 1 ? 'scor exact' : 'scoruri exacte'}` : ''}.</p>` : ''}<div class="grp plain">${rows}</div>`;
  };
  draw();
  await Promise.all(ids.filter(id => new Date(P[id].date).getTime() < Date.now() - 105 * 60e3).map(id => lim(async () => {
    try { const { ev: e } = await finalResult(id, P[id].slug); if (e?.done) out.set(id, { h: e.home.score, a: e.away.score }); } catch (e) {}
  })));
  draw();
}

let TRAIN = null, trainSel = 'all', trainStats = false, flash = { t: '', c: '' };
function calLine(slug) {

/* timpul de joc: u = minute jucate, cu prelungirile (prima repriză are 45 + s1 minute) */
// minutul afișat de surse: „63'”, „45'+2'”, „90+3'”
function lvClock(s) {
  const m = /(\d+)\s*'?\s*(?:\+\s*(\d+))?/.exec(String(s || ''));
  return m ? [+m[1], m[2] ? +m[2] : 0] : null;

// perioada după minutul regulamentar: 1 (0–45), 2 (46–90), 3 și 4 (prelungiri)
const lvPer = (base, add) => base <= 45 ? 1 : base <= 90 ? 2 : base <= 105 ? 3 : 4;
function lvU(per, base, add, s1, s2 = 6) {
  const H1 = 45 + s1;
  if (per <= 1) return Math.min(base, 45) + add + Math.max(0, base - 45);
  if (per === 2) return H1 + Math.max(0, Math.min(base, 90) - 45) + add + Math.max(0, base - 90);
  const H2 = H1 + 45 + s2;
  return H2 + Math.max(0, base - 90) + add;
}
// eticheta unui minut de joc (pentru grafice): 0–45, „45+2”, apoi 46–90
function lvLab(u, s1, s2 = 6) {
  const H1 = 45 + s1, H2 = H1 + 45 + s2;
  if (u <= 45) return `${Math.max(1, Math.ceil(u))}'`;
  if (u <= H1) return `45+${Math.max(1, Math.ceil(u - 45))}'`;
  if (u <= H1 + 45) return `${45 + Math.max(1, Math.ceil(u - H1))}'`;
  if (u <= H2) return `90+${Math.max(1, Math.ceil(u - H1 - 45))}'`;
  return `${90 + Math.max(1, Math.ceil(u - H2))}'`;
}

/* cronologia: ce s-a întâmplat, minut cu minut. k: goal, og (autogol), sot, off, blk, wood, cor, foul, fka (lovitură liberă în

const LVPW = { goal: 3.5, sot: 3, wood: 2.5, off: 1.6, blk: 1.2, cor: 1, pen: 4, offs: 0.4, fka: 0.5 };
function lvTeamOf(name, ev, tid) {

// o frază din comentariul ESPN (formatul Opta, în engleză) → tipul evenimentului și echipa

  if (/^attempt saved/i.test(T) || /shot on target|attempt saved/.test(ty)) return { k: 'sot', n: par };
  if (/^attempt blocked/i.test(T) || /blocked/.test(ty)) return { k: 'blk', n: par };
  if (/^attempt missed/i.test(T) || /shot off target|attempt missed/.test(ty)) return { k: /hits the .*(post|bar)/i.test(T) ? 'wood' : 'off', n: par };
  if (/hits the .*(post|bar)/i.test(T)) return { k: 'wood', n: par };
  if ((m = /^corner,\s*([^.]+)\./i.exec(T))) return { k: 'cor', n: m[1].trim() };
  if (/corner/.test(ty)) return { k: 'cor', n: par };
  if ((m = /^offside,\s*([^.]+)\./i.exec(T))) return { k: 'offs', n: m[1].trim() };
  if (/offside/.test(ty)) return { k: 'offs', n: par };
  if (/second yellow|is shown the red card/i.test(T) || /red card/.test(ty)) return { k: 'rc', n: par };
  if (/is shown the yellow card/i.test(T) || /yellow card/.test(ty)) return { k: 'yc', n: par };
  if ((m = /^penalty conceded by [^(]+\(([^)]+)\)/i.exec(T))) return { k: 'penc', n: m[1].trim() };
  if (/^(foul|hand ball|dangerous play) by/i.test(T) || /^foul$/.test(ty)) return { k: 'foul', n: par };

    if (fin(c?.value)) { const mm = c.value / 60; return { per: per || (mm <= 45 ? 1 : 2), base: Math.floor(mm), add: 0 }; }

  if (w10 && w10.real.datt) facts.push(`Atacuri periculoase în ultimele 10 minute: ${w10.real.datt[0] ?? '–'}–${w10.real.datt[1] ?? '–'}`);
  if (past) {
    const g = L.tl.filter(o => o.k === 'goal' || o.k === 'og');
    if (g.length) out.push({ h: 'Momentele decisive', t: g.map(o => `${lvLab(o.u, L.s1)} ${o.k === 'og' ? 'autogol' : 'gol'}${o.t != null ? ` ${esc(nm(o.t))}` : ''}${o.x ? ` (${esc(o.x)})` : ''}`).join('; ') + '.' });

  sc = clamp(Math.round(sc), 0, 100);
  return { paras: out, facts, conf: { lvl: sc >= 70 ? 'ridicată' : sc >= 45 ? 'medie' : 'scăzută', sc, why } };
}

  mb.style.setProperty('--ca', ca); mb.style.setProperty('--cb', cb);
  const p = location.hash.split('/');

    mb.innerHTML = ev.state === 'in' ? `<div class="sec"><h2>Cote</h2></div><div class="panel"><p class="note" style="margin:0">Meciul a început, iar cotele de dinainte nu mai sunt valabile. Cotele live sunt în analiza live, la Cote.</p><div class="acts" style="padding:10px 0 0"><a class="btn" href="#/live/${esc(p[2] || '')}/${esc(p[3] || '')}/cote">Deschide cotele live</a></div></div>`
      : '<div class="sec"><h2>Cote</h2></div><p class="empty">Meciul s-a terminat; cotele nu mai sunt în ofertă.</p>';
    return;
  }
  const S = LV.get(ev.id) || { id: ev.id, bsel: [], w: 10, sb: { st: 'idle' } };
  LV.set(ev.id, S);
  Object.assign(S, { ev, sum, live, id: ev.id });
  S.oexp ||= new Set(); S.osec = ODSECS.some(x => x[0] === opt.sub) ? opt.sub : ODSET.sec || 'top'; S.oq = '';
  ODCUR = S;
  S.L = lvPre(ev);
  mb.innerHTML = `<div id="odtop"></div><div id="odchips"></div><div class="odsrch" id="odsrch" hidden><input type="search" id="odq" placeholder="Caută o piață (ex. cornere, pauză, Saka)" autocomplete="off" enterkeyhint="search" aria-label="Caută o piață"></div><div id="odbody" class="odbody"></div><div class="odbar" id="odbar" hidden></div><div class="odhint" id="odhint" role="status" hidden></div>`;
  odWire(S);
  if (!S.B && !S.bJob) lvLoadBase(S);
  S.bJob?.finally(() => { if (live() && ODCUR === S) { S.sims = null; odUpdate(S); odRender(S); } });

  else odLoad(S);
  odRender(S);
  restoreScroll();
}

const LVLIST = { sec: 0 };
function viewLiveList(live) {
  V.innerHTML = `${hero('Live', gearBtn())}
    <div class="lvlhd"><div class="lvst"><span class="lvdot" id="lvldot"></span><b id="lvlttl">Caut meciurile în desfășurare…</b><button type="button" class="btn sm" data-lvlr="1">Actualizează</button></div><p class="lvsrc" id="lvlsrc"></p></div>
    <div class="prog"><i id="pg"></i></div><div id="list"></div>`;
  const ymd = ymdOf(new Date()), res = new Map(), slugs = HOME_SLUGS;
  let done = 0, failed = 0, raf = 0;
  const href = e => `#/live/${e.slug || 'x'}/${e.id}`;
  const group = (rows, sort) => {
    const by = new Map();
    for (const [s, e] of rows) { if (!by.has(s)) by.set(s, []); by.get(s).push(e); }
    return slugs.filter(s => by.has(s)).map(s => `<section><a class="ch" href="#/c/${s}/meciuri">${compIcon(s)}<span>${esc(compLabel(s))}</span></a><div class="grp">${by.get(s).sort(sort).map(e => matchRow(e, href)).join('')}</div></section>`).join('');
  };

    const now = Date.now(), all = [];
    for (const s of slugs) for (const e of res.get(s) || []) all.push([s, e]);
    const byTime = (a, b) => new Date(a.date) - new Date(b.date);
    const inPlay = all.filter(([, e]) => e.state === 'in');
    const soon = all.filter(([, e]) => e.state === 'pre' && new Date(e.date) - now < 3 * 3600e3);
    const ended = all.filter(([, e]) => e.state === 'post' && now - new Date(e.date) < 5 * 3600e3);
    const finished = done === slugs.length;
    let html = '';
    if (inPlay.length) html += `<div class="sec"><h2>În desfășurare</h2><span class="aside">${plural(inPlay.length, 'meci', 'meciuri')}</span></div>${group(inPlay, byTime)}`;
    else if (finished) html += `<div class="sec"><h2>În desfășurare</h2></div><p class="empty">Acum nu se joacă niciun meci în competițiile din aplicație.${soon.length ? '' : ' Alege un meci din Meciuri ca să-i vezi analiza live când începe.'}</p>`;

    if (ended.length) html += `<details class="lvended"><summary>Terminate de curând (${ended.length})</summary>${group(ended, (a, b) => byTime(b, a))}</details>`;

    // starea de sus: câte meciuri, de la ce surse și când au fost citite datele
    const ttl = $('#lvlttl'), dot = $('#lvldot'), src = $('#lvlsrc');
    if (ttl) ttl.textContent = !finished && !inPlay.length ? 'Caut meciurile în desfășurare…' : inPlay.length ? `${plural(inPlay.length, 'meci', 'meciuri')} în desfășurare` : 'Niciun meci în desfășurare';
    if (dot) dot.classList.toggle('on', inPlay.length > 0);

      const ts = slugs.filter(s => res.get(s)).map(s => MEM.get(sbKey(s, ymd))?.t).filter(fin);
      const names = uniq(slugs.filter(s => res.get(s)).map(s => (RO_CID[s] ? '365Scores' : 'ESPN')));
      const old = ts.length ? Math.min(...ts) : null;

    }

    .then(evs => { res.set(s, evs); }, () => { failed++; res.set(s, null); })
    .finally(() => {
      done++; tick();

        const any = [...res.values()].some(l => l?.some(e => e.state === 'in'));

const VFPC = [['fs', 'Faultat', 'faulturi suferite'], ['fc', 'Faultează', 'faulturi comise'], ['sh', 'Șuturi', 'șuturi'], ['sot', 'Pe poartă', 'șuturi pe poartă'], ['g', 'Marcator', 'goluri'], ['a', 'Pasă de gol', 'pase de gol'], ['k', 'Cartonaș', 'cartonașe']];

/* ---------- Value finder: mișcarea cotelor, cota de închidere, echipele de start ----------
   La fiecare selecție din jurnal: x[10] = ultima cotă văzută înainte de start (la ora x[11]), x[12] = prima cotă văzută,
   x[13] = ora recomandării (la celelalte, a primei citiri), x[14] = casa recomandării (cotele se compară doar la aceeași casă). Recomandările rămân cu cota și estimarea de când au apărut (profitul se socotește
   la cota de atunci); dacă până la start cota scade, piața a mers spre estimare: „cota de închidere” (CLV) e, pe termen lung,
   cel mai sigur semn că recomandările bat casa, mult înainte să se vadă în profit.
   m.ev = meciul (pentru analiza de dinainte de start), m.lu = { at, add, drop }: ce recomandări au apărut sau au dispărut după echipele de start. */
const vfKey = (sec, c) => sec + '|' + JSON.stringify(c);
const vfEvMin = (ev, slug) => ({ id: ev.id, slug: slug || ev.slug || '', date: ev.date, state: 'pre', status: '', neutral: !!ev.neutral,
  home: { id: ev.home.id, name: ev.home.name, short: ev.home.short || '', en: ev.home.en || '' }, away: { id: ev.away.id, name: ev.away.name, short: ev.away.short || '', en: ev.away.en || '' } });
// cota de închidere a unei recomandări: ultima cotă citită după recomandare, cu cel mult 3 ore înainte de start
function vfClv(m, x) {
  if (!x[5] || !fin(x[10]) || !fin(x[11]) || !fin(x[13]) || !(x[10] > 1)) return null;
  if (!(x[11] > x[13] + 60e3) || Date.parse(m.d) - x[11] > 3 * 3600e3) return null;
  return { o: x[10], d: x[4] / x[10] - 1, t: x[11] };
}
function vfClvStats(days = 30) {
  const from = Date.now() - days * 864e5;
  let n = 0, pos = 0, neg = 0, sum = 0;
  for (const m of Object.values(VFL.m)) {
    if (m.v || !(Date.parse(m.d) >= from)) continue;
    for (const x of m.x) { const c = vfClv(m, x); if (!c) continue; n++; sum += c.d; if (c.d > 0.005) pos++; else if (c.d < -0.005) neg++; }
  }

}
// cât s-a mișcat cota față de prima citire (↓ = a scăzut: cine a luat-o devreme are o cotă mai bună decât acum)
function vfMove(evId, x, short = false, src = '') {
  const m = VFL.m[evId];

  const k = vfKey(x.sec, x.c), y = m.x.find(z => z[1] && vfKey(z[0], z[1]) === k);
  if (!y || !fin(y[12]) || !(y[12] > 1) || (src && (y[14] || m.src) !== src)) return '';
  const d = x.odd / y[12] - 1;
  if (Math.abs(d) < 0.02) return '';
  return short ? ` <i class="vfmv ${d < 0 ? 'dn' : 'up'}" title="prima cotă văzută">${d < 0 ? '↓' : '↑'} ${nf2.format(y[12])}</i>`
    : `<small class="vfmv ${d < 0 ? 'dn' : 'up'}" title="prima cotă văzută">${d < 0 ? '↓' : '↑'} de la ${nf2.format(y[12])}</small>`;
}

// echipele de start confirmate la 365Scores (o cerere; detaliile meciului țin 90 de secunde)
async function vfLuConf(ev) {
  let g = null, swap = false;
  if (is365(ev.id)) g = await game365(ev.id);
  else { const f = await find365(ev); if (!f) return false; swap = !!f.swap; g = await game365('s' + f.id); }
  const s = sides365(g, swap);

// cu mai puțin de 3 ore până la start, la meciurile cu recomandări (cât aplicația e deschisă, la 5 minute):
// - cotele recomandărilor se citesc din nou, cel mult o dată la 20 de minute, la aceeași casă (pentru cota de închidere);
// - în ultimele 75 de minute: când apar echipele de start confirmate, meciul se analizează din nou, o singură dată, cu ele (m.lu)
let vfPkOn = false;
async function vfPreKick() {
  if (vfPkOn || VF.busy || !navigator.onLine) return;
  vfPkOn = true;
  try {
    await vflReady;
    const now = Date.now(), left = m => Date.parse(m.d) - now;
    const due = Object.entries(VFL.m).filter(([, m]) => !m.o && !m.v && m.ev && m.x.some(x => x[5]) && left(m) > 2 * 60e3 && left(m) < 3 * 3600e3).sort((a, b) => left(a[1]) - left(b[1]));
    for (const [id, m] of due) {
      if (document.visibilityState !== 'visible') break;
      if (!m.lu && left(m) < 75 * 60e3 && now - (m.luc || 0) > 9 * 60e3) {
        m.luc = now; vflDirty = true;
        let conf = false;
        try { conf = await vfLuConf(m.ev); } catch (e) { conf = false; }
        if (conf) { try { await vfReanalyze(id, m); } catch (e) { logErr('Value finder: echipele de start', e); } continue; }
      }
      if (now - (m.at || 0) > 20 * 60e3) { try { await vfOddsSnap(id, m); } catch (e) { /* data viitoare */ } }
    }
  } finally { vfPkOn = false; }
}
async function vfReanalyze(id, m) {
  const before = new Set(m.x.filter(x => x[5] && x[1]).map(x => vfKey(x[0], x[1])));
  // estimarea de dinainte se reface la 20 de minute: acum o refac imediat, cu echipele de start
  VFC.delete(id); LVB.delete(id);
  try { localStorage.removeItem('careu.lvb:' + id); } catch (e) { }
  const r = await vfMatch(m.ev);
  if (!r?.rows) return;
  const P = vfPick(r.rows, false, 'all'), now = new Set([...P.safe, ...P.val, ...P.big].map(o => vfKey(o.sec, o.c)));
  vfLogMatch({ ...r, slug: m.sl }, true);
  const m2 = VFL.m[id];
  if (m2) { m2.lu = { at: Date.now(), add: [...now].filter(k => !before.has(k)), drop: [...before].filter(k => !now.has(k)) }; vflDirty = true; }
  if (VF.res.has(id)) { VF.res.set(id, { ...r, slug: m.sl }); vfDraw(); }
}
// cotele recomandărilor, citite din nou la casa fiecăreia (de obicei una singură)
async function vfOddsSnap(id, m) {
  const keyOf = n => (/^365Scores/.test(n) ? 's365' : n === 'Sofascore' ? 'sf' : n === 'Superbet' ? 'spb' : null);
  const srcs = uniq(m.x.filter(x => x[5] && x[1]).map(x => x[14] || m.src || '')).filter(keyOf).slice(0, 2);
  let t = 0;
  for (const name of srcs) {
    const S = { id, ev: m.ev, sb: { st: 'idle' }, bsel: [] };
    await odSrcLoad(S, { live: false, force: true, only: keyOf(name) });
    if (S.sb?.st !== 'ok' || S.sb.name !== name) continue;
    const odd = new Map(odRows(S).filter(r => r.c && r.open && r.odd > 1).map(r => [vfKey(r.sec, r.c), r.odd]));
    t = S.sb.at || Date.now();
    for (const x of m.x) { const k = x[1] && (x[14] || m.src) === name ? vfKey(x[0], x[1]) : null; if (k && odd.has(k)) { x[10] = odd.get(k); x[11] = t; } }
  }
  // și dacă nu s-a putut citi: următoarea încercare peste 20 de minute
  m.at = t || Date.now(); vflDirty = true;
}

/* ---------- „De ce?”: ce împinge estimarea, pe scurt, sub fiecare recomandare ----------

   odihna, absențele și echipele de start, arbitrul, cât cântăresc cotele). Pe lângă ele: cât e trasă estimarea spre casă pe tipul ăsta

const vfDom = c => { const k = c?.k; return !k ? 'g' : k === 'cor' || (k === 'cnt' && c.m === 'c') ? 'c' : k === 'card' || (k === 'cnt' && c.m === 'k') ? 'k' : k === 'sotT' || (k === 'cnt' && (c.m === 't' || c.m === 'sh')) ? 's' : 'g'; };
const vfF1 = v => nf1.format(v), vfF2 = v => nf2.format(v);
function vfWhyItems(r, x) {
  const ev = r.ev, B = r.B || {}, W = B.w || {}, H = esc(ev.home.short || ev.home.name), A = esc(ev.away.short || ev.away.name), out = [], d = vfDom(x.c);
  const two = (lab, b) => (Array.isArray(b) && b.every(fin) ? `${lab}: ${H} ${vfF1(b[0])} – ${A} ${vfF1(b[1])} (total ${vfF1(b[0] + b[1])}).` : '');
  if (fin(x.fair)) {
    const p = x.pv ?? x.pm, dd = Math.round((p - x.fair) * 100);

/* ---------- Analiză: „Unde vede modelul valoare” pe toată oferta casei ----------

// fila aleasă: implicit „Simple” (pariurile de bază, ca înainte); alegerea rămâne

// și totalurile pe meci la cornere, cartonașe, șuturi și șuturi pe poartă
const vbSimple = r => !!r.c && r.sec !== 'pl' && r.sec !== 'bb' && (['1x2', 'dc', 'btts', 'ou', 'tg', 'cor', 'sotT'].includes(r.c.k) || (r.c.k === 'card' && !r.c.y) || (r.c.k === 'cnt' && !r.c.h && r.c.op === 'ou' && r.c.t == null && ['c', 'k', 't', 'sh'].includes(r.c.m)));

    ${chips}

    ${!VBALL && (typ === 'all' ? uniq.length : top.length) > shown.length ? `<div class="acts" style="padding:8px 0 0"><button class="btn" type="button" data-vball="1">Arată toate (${typ === 'all' ? uniq.length : top.length})</button></div>` : ''}
    <p class="note" style="margin-top:8px">„Model” e estimarea doar din formă, odihnă și absențe, fără cote; „Piața” e probabilitatea din cotele ${esc(src)}, fără marja casei (la jucători, cu marjă: fiecare jucător e o piață separată). „Valoare” e probabilitatea modelului × cota − 1, cu miza returnată socotită la handicap și „egal pariu anulat”. Las deoparte selecțiile la care modelul și piața diferă prea mult: de obicei modelului îi lipsește ceva. La jucători, estimările apar după ce deschizi fila Jucători a meciului (sau după Value finder). „Alte case” sunt cotele celorlalte surse citite pentru același pariu; „↑” / „↓” arată cum s-a mișcat cota de la prima citire în Value finder.</p></div></details>`;

/* ---------- cotele celorlalte case ----------
   Sursele se citesc deodată (Superbet, Sofascore, 365Scores cu casa ei parteneră, de obicei Betano). Pentru fiecare pariu al casei alese
   caut același pariu la celelalte, citite la fel ca în fila Cote (odRows), în aceeași formă de decontare (la jucători: categoria, jucătorul,
   pragul și sensul). La handicap, doar când nicio sursă nu are echipele inversate (linia ar putea fi citită din partea cealaltă). */
const odAltName = x => (x.key === 's365' ? x.bk || '365Scores' : x.key === 'sf' ? 'Sofascore' : 'Superbet');
const odPlKey = P => `pl|${P.cat}|${pnorm(P.who || '')}|${P.L}|${P.side}`;
const ODHC = new Set(['ah', 'eh', 'hc']);
function odAltKey(r) {
  if (r.sec === 'pl') { const P = r.P || (r.s ? odPlParse(r.s) : null); return P && !P.bad && P.who && fin(P.L) ? odPlKey(P) : null; }
  if (!r.c || r.c.k === 'bb' || r.sec === 'bb') return null;
  const { rk, ...c } = r.c;
  return 'c|' + JSON.stringify(c);
}
function odAltMap(S) {
  const M = new Map(), main = S.sb?.st === 'ok' ? S.sb.src : null;
  M.hc = !S.sb?.swap;
  for (const [k] of ODS) {
    const x = S.srcs?.[k];
    if (!x?.ok || k === main || !x.sel?.length) continue;
    const nm = odAltName(x);
    let rows = [];
    try { rows = odRows({ ev: S.ev, sb: { st: 'ok', src: x.key, name: x.name, id: x.id, swap: x.swap, h: x.h, a: x.a, sel: x.sel, at: x.at } }); } catch (e) { rows = []; }
    for (const r of rows) {
      if (!r.open || !(r.odd > 1) || (x.swap && r.c && ODHC.has(r.c.k))) continue;
      let key = null;
      try { key = odAltKey(r); } catch (e) { key = null; }
      if (!key) continue;
      const L = M.get(key) || [], o = L.find(a => a.n === nm);
      if (o) o.o = Math.max(o.o, r.odd); else L.push({ n: nm, o: r.odd });

}

  let k = null;
  try { k = odAltKey(r); } catch (e) { k = null; }
  const L = k && M.get(k);
  return L?.length ? L.slice().sort((a, b) => b.o - a.o) : null;
}
// „Betano 2,05 · Sofascore 1,98”: cea mai bună, scoasă în evidență când e peste cota casei alese (cu valoarea de acolo, dacă știu șansa)
function odAltHTML(alt, odd, pv = null, tp = 1) {
  if (!alt?.length) return '';
  const better = alt[0].o > odd + 1e-9, val = better && fin(pv) ? tp * (pv * alt[0].o - 1) : null;
  return `${alt.map((a, i) => (i === 0 && better ? `<b class="pos">${esc(a.n)} ${nf2.format(a.o)}</b>` : `${esc(a.n)} ${nf2.format(a.o)}`)).join(' · ')}${fin(val) ? ` (acolo valoare ${val >= 0 ? '+' : '−'}${Math.round(Math.abs(val) * 100)}%)` : ''}`;
}

/* ---------- arbitrul la cartonașe ----------
   Numele lui (Sofascore, altfel ESPN), apoi cât schimbă el cartonașele așteptate: din meciurile lui din sezon citite de aplicație (REFS) sau,
   când sunt puține, din cariera de la Sofascore față de media competiției. Cu puține meciuri efectul e tras spre zero (refFactor, între 0,75 și 1,35).
   Înmulțește doar partea modelului la cartonașe (cotele îl au deja în preț). Se ține minte 12 ore pe meci (o oră, cât arbitrul nu e anunțat). */
const REFX = new Map();
// media de cartonașe pe meci într-o competiție, din meciurile învățate (cel puțin 30)
function lgCardsAvg(slug) {
  const L = Object.values(LEARN.s).filter(s => s.sl === slug && fin(s.R?.[4]) && fin(s.R?.[5])).map(s => s.R[4] + s.R[5]);
  return L.length >= 30 ? mean(L) : null;
}
async function refMatch(ev) {
  const hit = REFX.get(ev.id);

  let name = '', car = null, base = null, src = '';
  try {
    if (!xOff('sofa')) {
      const f = await sofaFind(ev);
      if (f) {
        const e = await sofaEvent(f.id), r = sofaRefOf(e);
        if (r) {
          name = r.name; car = r.car; src = 'Sofascore';
          const ut = e?.tournament?.uniqueTournament?.id, s = e?.season?.id;
          if (ut != null && s != null) { try { base = await sofaCompAvg(`${ut}/${s}`); } catch (x) { base = null; } }
        }
      }
    }
  } catch (e) { /* fără Sofascore: încerc ESPN */ }
  if (!name && !is365(ev.id) && ev.slug) { try { const n = await coreRef(ev.slug, ev.id); if (n) { name = n; src = 'ESPN'; } } catch (e) { } }
  let out = { at: Date.now(), name, f: 1, n: 0, k: null, base: null, src, how: '' };
  if (name) {
    const country = refCountry(ev.slug, car?.ctry);
    let st = null;
    try { st = refSeason(name, seasonFrom(ev.date, country), new Date(), ev.id); } catch (e) { st = null; }
    if (st && st.n >= 5 && fin(st.k) && st.baseK > 0) out = { ...out, f: refFactor(st), n: st.n, k: st.k, base: st.baseK, how: 'sezon' };
    else if (car && car.g >= 10) {
      const k = (car.y + car.r) / car.g, b = fin(base) && base > 0 ? base : lgCardsAvg(ev.slug) ?? 4.4;
      // cariera e din mai multe competiții și sezoane: cântărește cât cel mult 15 meciuri din sezon
      out = { ...out, f: refFactor({ n: Math.min(car.g, 15), k, baseK: b }), n: car.g, k, base: b, how: 'carieră' };
    }
  }
  REFX.set(ev.id, out);

/* ---------- Pinnacle (The Odds API): prețul corect al pieței ----------
   Pinnacle are cea mai mică marjă, iar cotele ei sunt cele mai apropiate de adevăr. Din tabla competiției (o cerere = 2 credite) iau,
   fără marjă, rezultatul final și totalurile de goluri. Value finder citește cel mult PIN_DAY competiții pe zi (sunt 500 de credite gratuite pe lună),

function tkBadge() { const b = $('#bt-tiles [data-btt="bilet"] .lb'); if (b) b.textContent = btBadge('bilet'); }
const tkWon = l => Array.isArray(l.res) && l.res[0] >= 0.999, tkLost = l => Array.isArray(l.res) && l.res[1] >= 0.999;
const tkVoid = l => Array.isArray(l.res) && !tkWon(l) && !tkLost(l);
function tkGroups() {
  const G = new Map();
  for (const l of TKT.legs) { if (!G.has(l.ev.id)) G.set(l.ev.id, []); G.get(l.ev.id).push(l); }
  return [...G.values()].sort((a, b) => Date.parse(a[0].ev.date) - Date.parse(b[0].ev.date));
}
// simularea unui meci (ca la Builder), ținută 20 de minute
async function tkSims(ev) {
  const hit = TK.sims.get(ev.id);
  if (hit && Date.now() - hit.t < 20 * 60e3) return hit.r;
  const B = await lvBase({ ...ev, state: 'pre' }, null), Q = odModel(B, ev), r = odSims(Q, 20000);
  TK.sims.set(ev.id, { t: Date.now(), r });
  return r;
}
const tkShare = (R, legs, L) => (R.length ? R.reduce((s, r) => s + (legs.every(l => lvLegOk(l.c, r, L)) ? 1 : 0), 0) / R.length : null);
// șansele: pe fiecare selecție și pe fiecare meci (pentru cele încă nejucate, din simulare; altfel estimarea de când au fost puse)
async function tkEval() {
  if (TK.busy) return TK.ev;
  TK.busy = true;
  try {
    const out = { at: Date.now(), g: new Map(), leg: new Map() };
    for (const legs of tkGroups()) {
      const ev = legs[0].ev, open = legs.filter(l => !l.res), pre = Date.parse(ev.date) > Date.now();
      let R = null;
      if (pre && open.length) { try { R = await tkSims(ev); } catch (e) { R = null; } }
      const L = lvPre(ev);
      for (const l of legs) out.leg.set(l.id, l.res ? (tkWon(l) ? 1 : tkLost(l) ? 0 : 1) : R ? tkShare(R, [l], L) : l.pm);
      const p = legs.some(tkLost) ? 0 : !open.length ? 1 : R ? tkShare(R, open, L) : open.reduce((s, l) => s * (fin(l.pm) ? l.pm : NaN), 1);
      out.g.set(ev.id, { p, sim: !!R, R, L });
    }
    TK.ev = out;
  } finally { TK.busy = false; }
  return TK.ev;
}
// șansa biletului fără o selecție (pentru „piciorul cel mai slab”)
function tkWithout(E, id) {
  let p = 1;
  for (const legs of tkGroups()) {
    const g = E.g.get(legs[0].ev.id), rest = legs.filter(l => l.id !== id && !l.res);
    if (legs.some(tkLost)) return 0;
    if (!rest.length) continue;
    p *= g?.R ? tkShare(g.R, rest, g.L) : rest.reduce((s, l) => s * (fin(l.pm) ? l.pm : NaN), 1);
  }
  return p;
}
// decontarea: meciurile începute de cel puțin 2,5 ore (ca în Value finder)
let tkSettling = null;
function tkSettle() {
  if (tkSettling) return tkSettling;
  tkSettling = (async () => {
    let got = 0;
    const due = tkGroups().filter(legs => legs.some(l => !l.res) && Date.parse(legs[0].ev.date) < Date.now() - 2.5 * 3600e3);
    for (const legs of due) {
      const e = legs[0].ev, ev0 = { ...e, state: 'post', status: '' };
      try {
        const L = await BGLIM.t(() => lvFetch(ev0, { x365: false, ttl: 10 * 60e3 }));
        if (/POSTPONED|CANCEL|ABANDON|SUSPEND/i.test(String(L.ev?.status || ''))) { for (const l of legs) if (!l.res) { l.res = [0, 0]; l.v = 1; got++; } continue; }
        if (L.state !== 'post') continue;
        const R = vfResR(L);
        for (const l of legs) {
          if (l.res || (vfNeedsSeq(l.c) && !R.seq)) continue;
          try { const q = odRes(l.c, R); if (q && fin(q[0]) && fin(q[1])) { l.res = [r3(q[0]), r3(q[1])]; got++; } } catch (x) { /* rămâne nedecontat */ }
        }
        legs[0].sc = [R.h, R.a];
        for (const l of legs) l.sc = [R.h, R.a];
      } catch (x) { /* data viitoare */ }
    }
    if (got) { tkSave(); TK.ev = null; }
    return got;
  })();
  tkSettling.finally(() => { tkSettling = null; }).catch(() => { });
  return tkSettling;
}
function tkHTML() {
  const legs = TKT.legs, G = tkGroups(), E = TK.ev;
  const head = `<div class="sec"><h2>Biletul meu</h2><span class="aside">${legs.length ? `${plural(legs.length, 'selecție', 'selecții')} · ${plural(G.length, 'meci', 'meciuri')}` : 'gol'}</span></div>`;
  if (!legs.length) return `${head}<p class="empty">Biletul e gol. Pune selecții din Value finder (butonul „+ Bilet” de sub fiecare recomandare) sau din Builder, în pagina unui meci („Pe biletul meu”).</p>${tkMethod()}`;
  const st = l => l.v ? 'amânat (cota 1)' : tkWon(l) ? '<b class="pos">✓ câștigat</b>' : tkLost(l) ? '<b class="neg">✗ pierdut</b>' : tkVoid(l) ? 'miză returnată' : Date.parse(l.ev.date) <= Date.now() ? 'în joc sau așteaptă rezultatul' : (p => (fin(p) ? `<span class="lvm">≈ ${pct(p)}</span>` : ''))(E?.leg.get(l.id) ?? l.pm);
  const rows = G.map(ls => {
    const e = ls[0].ev, sc = ls[0].sc;
    return `<div class="tkm"><a class="tkh" href="#/m/${esc(ls[0].slug || e.slug || 'x')}/${esc(e.id)}"><b>${esc(e.home.short || e.home.name)} – ${esc(e.away.short || e.away.name)}</b><small>${sc ? `${sc[0]}–${sc[1]} · ` : ''}${esc(fDay.format(new Date(e.date)))}, ${esc(fTime.format(new Date(e.date)))} · ${esc(compLabel(ls[0].slug || e.slug))}</small></a>
      ${ls.map(l => `<div class="row tkr"><span class="grow">${l.lab}<small>${l.odd ? `${esc(l.src || 'cota')} ${nf2.format(l.odd)} · ` : ''}${st(l)}</small></span><button class="ico" type="button" data-tkrm="${esc(l.id)}" aria-label="Scoate de pe bilet">✕</button></div>`).join('')}</div>`;
  }).join('');
  // selecții încă deschise din același meci: casele nu înmulțesc cotele lor, așa că produsul nu e o cotă reală și valoarea se socotește doar cu cota scrisă de utilizator
  const sgIds = new Set(G.filter(ls => ls.filter(l => !l.res && !l.v).length >= 2).map(ls => ls[0].ev.id)), sg = sgIds.size > 0;
  const odds = legs.every(l => l.odd > 1) ? legs.reduce((s, l) => s * (l.v || tkVoid(l) ? 1 : l.odd), 1) : null, my = lvNum(TKT.odd), used = my > 1 ? my : sg ? null : odds;
  const lost = legs.some(tkLost), done = legs.every(l => l.res);
  let p = null;
  if (lost) p = 0; else if (done) p = 1; else if (E) p = [...E.g.values()].reduce((s, g) => s * (fin(g.p) ? g.p : NaN), 1);
  const ev = fin(p) && used ? p * used - 1 : null;
  let weak = '';
  if (E && !lost && !done && legs.filter(l => !l.res).length >= 2) {
    const cand = legs.filter(l => !l.res && l.odd > 1).map(l => ({ l, v: (E.leg.get(l.id) ?? l.pm) * l.odd - 1 })).filter(x => fin(x.v)).sort((a, b) => a.v - b.v);
    if (cand.length && cand[0].v < 0.03) {
      const w = cand[0], p2 = tkWithout(E, w.l.id), o2 = used && !sgIds.has(w.l.ev.id) ? used / w.l.odd : null, v2 = fin(p2) && o2 ? p2 * o2 - 1 : null;
      weak = `<p class="note tkweak">Piciorul cel mai slab: <b>${w.l.lab}</b> (${esc(w.l.ev.home.short || w.l.ev.home.name)} – ${esc(w.l.ev.away.short || w.l.ev.away.name)}), cu ${w.v >= 0 ? 'valoare de doar +' : 'valoare '}${w.v >= 0 ? '' : '−'}${Math.round(Math.abs(w.v) * 100)}% singur.${fin(p2) ? ` Fără el: șansa ≈ ${pct(p2)}${fin(v2) ? `, cota ${nf2.format(o2)}, valoare ${v2 >= 0 ? '+' : '−'}${Math.round(Math.abs(v2) * 100)}%` : ''}.` : ''}</p>`;
    }
  }
  const status = lost ? '<p class="lvbev neg">Biletul e pierdut.</p>' : done ? '<p class="lvbev pos">Biletul e câștigat.</p>' : '';
  return `${head}<div class="grp tkl">${rows}</div>
    <div class="panel lvbsum tksum">
      <div class="lvbg"><div><small>${sg ? 'Produsul cotelor' : 'Cotă totală'}</small><b>${odds ? nf2.format(odds) : '–'}</b></div><div><small>Șansa estimată</small><b class="lvm">${fin(p) ? '≈ ' + pct(p) : TK.busy ? '…' : '–'}</b></div><div><small>Cota corectă</small><b class="lvm">${fin(p) && p > 0 ? '≈ ' + fairOdd(p) : '–'}</b></div></div>
      <label class="field col" style="padding:8px 0 0"><span>Cota de pe biletul tău (opțional)<small>La selecții din același meci, casele calculează altfel cota; scrie-o aici ca să compari corect</small></span><input type="text" inputmode="decimal" id="tkodd" value="${esc(TKT.odd || '')}" placeholder="${odds && !sg ? nf2.format(odds) : 'ex. 5,40'}" autocomplete="off" maxlength="8"></label>
      ${status || (fin(ev) && p > 0.0005 ? `<p class="lvbev ${ev >= 0.03 ? 'pos' : ev <= -0.05 ? 'neg' : ''}">${ev >= 0 ? 'Valoare estimată' : 'Fără valoare'}: ${ev >= 0 ? '+' : '−'}${Math.round(Math.abs(ev) * 100)}% la cota ${nf2.format(used)}</p>` : sg && !(my > 1) ? `<p class="note tksg">Ai mai multe selecții din același meci: casele nu înmulțesc cotele lor, așa că produsul nu e cota reală.${fin(p) && p > 0.0005 ? ` Biletul are valoare dacă cota de pe el e peste <b>${fairOdd(p)}</b>; scrie-o mai sus și îți spun cât.` : ' Scrie mai sus cota de pe bilet.'}</p>` : '')}
      ${weak}
      ${TK.msg ? `<p class="note">${esc(TK.msg)}</p>` : ''}
      <div class="acts" style="padding:8px 0 0"><button class="btn" type="button" data-tkev="1">Recalculează</button><button class="btn" type="button" data-tkclr="1">Golește biletul</button></div></div>
    ${tkMethod()}`;
}
const tkMethod = () => `<p class="method"><b>Cum calculez.</b> Pentru meciurile care nu au început, simulez fiecare meci de 20.000 de ori cu modelul din Analiză, ca la Builder: selecțiile din același meci se socotesc împreună (de exemplu „peste 2,5” și „ambele marchează” ies des împreună), iar meciurile diferite sunt independente, așa că șansele lor se înmulțesc. Cota totală e produsul cotelor; cota corectă e 1 împărțit la șansă; valoarea e șansa înmulțită cu cota, minus 1. Un bilet cu multe selecții are, aproape mereu, valoare mai mică decât fiecare selecție singură, pentru că marja casei se adună la fiecare. Piciorul cel mai slab e selecția cu cea mai mică valoare singură. După meciuri, selecțiile se decontează singure. Sunt estimări, nu garanții; aplicația nu plasează pariuri.</p>`;
function tkShow() {
  const box = $('#bt-bilet');
  if (!box) return;
  // mesajul „Pe bilet… Vezi biletul” nu mai are rost când biletul e deschis
  document.getElementById('tktoast')?.classList.remove('on');

  draw();
  box.onclick = e => {
    const rm = e.target.closest('[data-tkrm]');

    if (e.target.closest('[data-tkclr]')) { TKT = { legs: [], odd: '' }; tkSave(); TK.ev = null; draw(); return; }
    if (e.target.closest('[data-tkev]')) { TK.sims.clear(); TK.ev = null; draw(); tkSettle().then(() => tkEval()).then(draw); }
  };

  if (TKT.legs.length) tkSettle().then(() => tkEval()).then(draw).catch(() => { });

// fxLearn la pornire, după ce s-au citit modelul și jurnalul Value finder
Promise.all([btReady, vflReady]).then(() => { try { fxLearn(); } catch (e) { logErr('învățare: arbitru / echipe', e); } }).catch(() => { });

/* ---------- Value finder pe file de competiții (v19) ----------
   Cu 53 de campionate, recomandările din toate se amestecau. Trei file: „Top 10 ligi”, „Alte ligi” (celelalte campionate, ligile secundare,
   România și cupele naționale) și „Internaționale” (cupele europene, cele de pe alte continente și echipele naționale). Alegerea rămâne
   în Setări (settings.vftier); analiza zilei, cea pe jucători și Live iau întâi meciurile din fila deschisă. */
const vfTierLabel = k => (VF_TIERS.find(t => t[0] === k) || VF_TIERS[0])[1];
function vfTierN(slugs) {
  const c = Object.fromEntries(VF_TIERS.map(([k]) => [k, 0]));
  for (const s of slugs) c[vfTier(s)]++;
  return c;
}
// următorul meci de analizat: întâi din fila aleasă, apoi restul; dacă utilizatorul schimbă fila în timpul analizei, se schimbă și ordinea
function vfNext(list, taken, slugOf) {
  let k = list.findIndex(x => !taken.has(x) && vfTier(slugOf(x)) === VF.tier);
  if (k < 0) k = list.findIndex(x => !taken.has(x));
  if (k < 0) return null;
  taken.add(list[k]);
  return list[k];
}
// filele de sus, cu câte meciuri are fiecare; în timpul analizei se schimbă doar numerele, ca o atingere pe filă să nu se piardă
function vfTierSeg() {
  const box = $('#vftier');
  if (!box) return;
  if (VF.mode === 'res') { box.innerHTML = ''; return; }
  const live = VF.mode === 'live', L = live ? VF.lv.all || [] : VF.list;
  const known = live ? L.length > 0 || VF.lv.at > 0 : L.length > 0 || (!VF.busy && VF.ymdRun === VF.ymd && VF.at > 0);
  const C = vfTierN(L.map(x => x[0]));
  const cnt = k => (known ? (live ? plural(C[k], 'meci live', 'meciuri live') : plural(C[k], 'meci', 'meciuri')) : '');
  const seg = box.querySelector('.vftiers');
  if (seg) {
    for (const b of seg.querySelectorAll('[data-vfti]')) {
      b.setAttribute('aria-pressed', String(b.dataset.vfti === VF.tier));
      const t = cnt(b.dataset.vfti);
      let sm = b.querySelector('small.cnt');
      if (t) { if (!sm) { sm = document.createElement('small'); sm.className = 'cnt'; b.append(sm); } if (sm.textContent !== t) sm.textContent = t; } else sm?.remove();
    }
    return;
  }
  box.innerHTML = `<div class="segwrap" style="padding-bottom:8px"><div class="seg wide vftiers" role="group" aria-label="Competițiile">${VF_TIERS.map(([k, l]) => `<button type="button" data-vfti="${k}" aria-pressed="${VF.tier === k}">${esc(l)}${cnt(k) ? `<small class="cnt">${cnt(k)}</small>` : ''}</button>`).join('')}</div></div>`;
}
// fila aleasă n-are meciuri: unde sunt, cu butoane spre celelalte file
function vfTierEmptyHTML(slugs, live) {
  const C = vfTierN(slugs), other = VF_TIERS.filter(([k]) => k !== VF.tier && C[k]), D = vfDays();
  const lab = `„${vfTierLabel(VF.tier)}”`, when = VF.ymd === D[0][0] ? 'Azi' : VF.ymd === D[1][0] ? 'Mâine' : 'În ziua aleasă';
  return `<p class="empty">${live ? `Acum nu se joacă niciun meci în ${lab}.` : `${when} nu sunt meciuri în ${lab}.`}${other.length ? ` Sunt în ${listRo(other.map(([k, l]) => `„${l}” (${C[k]})`))}.` : ''}</p>`
    + (other.length ? `<div class="acts vfmore">${other.map(([k, l]) => `<button type="button" class="btn" data-vfti="${k}">Vezi ${esc(l)}</button>`).join('')}</div>` : '');
}
